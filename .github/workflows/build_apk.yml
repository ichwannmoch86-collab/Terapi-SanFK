name: Build Flet APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Flet
        run: pip install flet
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - name: Build APK
        run: flet build apk --name "Terapi Fokus SanFK"
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: SanFK-Focus-App
          path: build/apk/*.apk
